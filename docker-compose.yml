services:
  ollama:
    image: ollama/ollama:latest
    volumes:
      - ollama_data:/root/.ollama
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 5s
      timeout: 5s
      retries: 30

  ollama-init:
    image: ollama/ollama:latest
    depends_on:
      ollama:
        condition: service_healthy
    environment:
      OLLAMA_HOST: http://ollama:11434
    entrypoint: ["sh", "-c", "ollama pull ${OLLAMA_MODEL:-llama3.1}"]

  web:
    build: .
    depends_on:
      ollama-init:
        condition: service_completed_successfully
    ports:
      - "8000:8000"
    environment:
      OLLAMA_URL: http://ollama:11434
      OLLAMA_MODEL: ${OLLAMA_MODEL:-llama3.1}
      # CPU inference of an 8B model can run at just ~2 tokens/sec — a real
      # 20+ minute interview's transcript can take well over 5 minutes to
      # extract insights from. Raise further (or lower for faster/smaller
      # models) with OLLAMA_TIMEOUT_S=... before docker compose up.
      OLLAMA_TIMEOUT_S: ${OLLAMA_TIMEOUT_S:-1200}
      INSIGHT_ENGINE_DB: /data/insights.db
      INSIGHT_ENGINE_LLM: ollama
      # Avoids a slow/unreliable accelerated-download path that made the
      # first-run Whisper/HF model download hang in the previous prototype.
      HF_HUB_DISABLE_XET: "1"
    volumes:
      - insights_data:/data
      - whisper_cache:/root/.cache/huggingface

volumes:
  ollama_data:
  insights_data:
  whisper_cache:
